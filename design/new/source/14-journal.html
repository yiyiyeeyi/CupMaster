<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<title>Journal 首頁</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;1,400&amp;family=Noto+Serif+TC:wght@400;500&amp;family=Noto+Sans+TC:wght@300;400;500&amp;family=Inter:wght@300;400;500&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#211a16}a:hover{color:#8a3f24}
</style>
</helmet>
<div style="width: 390px; height: 844px; position: relative; overflow: hidden; background: #faf8f4; color: #211a16; font-family: Inter, 'Noto Sans TC', system-ui, sans-serif; font-weight: 300; font-variant-numeric: lining-nums tabular-nums">

  <div style="padding: 50px 24px 0; display: flex; justify-content: space-between; align-items: flex-end">
    <div style="display: flex; flex-direction: column; gap: 4px">
      <span style="font-size: 10px; letter-spacing: .24em; color: #8f8177">BREW JOURNAL</span>
      <h1 style="margin: 0; font-family: 'Cormorant Garamond', Georgia, serif; font-weight: 400; font-size: 44px; line-height: 1">Journal</h1>
    </div>
    <div style="display: flex; flex-direction: column; align-items: flex-end; gap: 2px; padding-bottom: 4px">
      <span style="font-family: 'Cormorant Garamond', Georgia, serif; font-size: 22px; line-height: 1">12<span style="font-size: 12px; font-family: Inter, sans-serif; color: #8f8177"> 杯</span></span>
      <span style="font-size: 11px; color: #8f8177">連續 5 天</span>
    </div>
  </div>

  <div style="margin: 18px 24px 0; display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); border-top: .5px solid #211a16; border-bottom: .5px solid #e3ddd3; padding: 10px 0 8px">
    <sc-for list="{{week}}" as="d" hint-placeholder-count="7">
      <div style="display: flex; flex-direction: column; align-items: center; gap: 4px">
        <span style="{{d.labelStyle}}">{{d.label}}</span>
        <svg width="40" height="30" viewBox="0 0 40 30" aria-hidden="true">
          <path d="M11 6 L25 6 L26 28 L10 28 Z" fill="none" stroke="#cfc6b8" stroke-width=".8" stroke-dasharray="2 2" opacity="{{d.emptyOp}}"></path>
          <path d="M5 7 L19 7 L20 28 L4 28 Z" fill="{{d.c3}}" opacity="{{d.op3}}" transform="rotate(-8 12 28)"></path>
          <path d="M21 7 L35 7 L36 28 L20 28 Z" fill="{{d.c2}}" opacity="{{d.op2}}" transform="rotate(8 28 28)"></path>
          <path d="M12 4 L28 4 L29 28 L11 28 Z" fill="{{d.c1}}" opacity="{{d.op1}}"></path>
        </svg>
        <span style="{{d.countStyle}}">{{d.count}}</span>
      </div>
    </sc-for>
  </div>

  <div style="margin: 16px 24px 0; display: flex; gap: 18px; font-size: 13px">
    <span style="font-weight: 500; border-bottom: 1px solid #211a16; padding-bottom: 4px">全部</span>
    <span style="color: #8f8177">依豆子</span>
    <span style="color: #8f8177">依沖法</span>
  </div>

  <div style="margin: 4px 24px 0; display: flex; flex-direction: column">
    <sc-for list="{{groups}}" as="g" hint-placeholder-count="2">
      <span style="font-size: 10px; letter-spacing: .2em; color: #8f8177; padding: 14px 0 2px">{{g.title}}</span>
      <sc-for list="{{g.rows}}" as="r" hint-placeholder-count="2">
        <a href="#" style="display: grid; grid-template-columns: 34px minmax(0, 1fr) auto; gap: 14px; align-items: center; padding: 12px 0; border-bottom: .5px solid #e3ddd3; text-decoration: none">
          <svg width="34" height="44" viewBox="0 0 40 52" role="img" aria-label="{{r.bean}} 豆袋">
            <path d="M7 8 L33 8 L35 50 L5 50 Z" fill="{{r.color}}"></path>
            <rect x="7" y="4" width="26" height="5" fill="{{r.color}}" opacity=".85"></rect>
            <rect x="12" y="22" width="16" height="13" fill="#faf8f4" opacity=".92"></rect>
            <line x1="14" y1="26" x2="26" y2="26" stroke="{{r.color}}" stroke-width="1"></line>
            <line x1="14" y1="30" x2="22" y2="30" stroke="{{r.color}}" stroke-width="1"></line>
          </svg>
          <div style="display: flex; flex-direction: column; gap: 5px; min-width: 0">
            <span style="font-family: 'Noto Serif TC', serif; font-weight: 400; font-size: 15px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{r.bean}}</span>
            <div style="display: flex; align-items: center; gap: 8px; white-space: nowrap">
              <span style="font-size: 10px; letter-spacing: 1px" role="img" aria-label="{{r.starsLabel}}">{{r.on}}<span style="color: #d6cec2">{{r.off}}</span></span>
              <span style="font-size: 11px; color: #8f8177">{{r.method}}</span>
              <span style="{{r.arrowStyle}}" role="img" aria-label="{{r.arrowLabel}}">{{r.arrow}}</span>
            </div>
          </div>
          <div style="display: flex; flex-direction: column; align-items: flex-end; gap: 3px">
            <span style="font-family: 'Cormorant Garamond', Georgia, serif; font-size: 20px; line-height: 1">{{r.ratio}}</span>
            <span style="font-size: 10px; color: #8f8177">粉水比</span>
          </div>
        </a>
      </sc-for>
    </sc-for>
  </div>

  <nav aria-label="主要導覽" style="position: absolute; left: 0; right: 0; bottom: 0; height: 84px; background: #faf8f4; border-top: .5px solid #e3ddd3; display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); padding-bottom: 16px; box-sizing: border-box"><a href="#" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; font-size: 10px; color: #8f8177; font-weight: 300; text-decoration: none"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linejoin="round" aria-hidden="true" style="flex: none"><circle cx="11" cy="11" r="6.5"></circle><path d="M16 16l4 4"></path></svg>Discover</a><a href="#" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; font-size: 10px; color: #8f8177; font-weight: 300; text-decoration: none"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linejoin="round" aria-hidden="true" style="flex: none"><path d="M12 20s-7-4.5-7-10a4 4 0 0 1 7-2.5A4 4 0 0 1 19 10c0 5.5-7 10-7 10z"></path></svg>Collection</a><a href="#" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; font-size: 10px; color: #211a16; font-weight: 300; text-decoration: none"><span style="width: 40px; height: 40px; border-radius: 50%; background: #211a16; color: #faf8f4; display: grid; place-items: center"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round" aria-hidden="true" style="flex: none"><path d="M5 6h14l-5 7h-4z"></path><path d="M9 16h6l-1 4h-4z"></path></svg></span>Brew</a><a href="#" aria-current="page" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; font-size: 10px; color: #211a16; font-weight: 500; text-decoration: none"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round" aria-hidden="true" style="flex: none"><path d="M6 4h12v16H6z"></path><path d="M9 8h6M9 12h6M9 16h3"></path></svg>Journal</a><a href="#" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; font-size: 10px; color: #8f8177; font-weight: 300; text-decoration: none"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linejoin="round" aria-hidden="true" style="flex: none"><circle cx="12" cy="9" r="3.5"></circle><path d="M5 20c1.5-4 12.5-4 14 0"></path></svg>Me</a></nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const C = { co: '#c4704f', et: '#d8c19b', ke: '#3f5a4a', gu: '#2f4d6e' };
    const days = [['一', []], ['二', ['gu']], ['三', []], ['四', ['co']], ['五', ['ke', 'co', 'et']], ['六', ['co']], ['日', ['co', 'et']]];
    const week = days.map((d, i) => {
      const b = d[1], n = b.length;
      return {
        label: d[0],
        labelStyle: 'font-size: 10px; ' + (i === 6 ? 'color: #211a16; font-weight: 500' : 'color: #8f8177'),
        emptyOp: n === 0 ? 1 : 0,
        c1: n ? C[b[0]] : 'none', op1: n >= 1 ? 1 : 0,
        c2: n >= 2 ? C[b[1]] : 'none', op2: n >= 2 ? 1 : 0,
        c3: n >= 3 ? C[b[2]] : 'none', op3: n >= 3 ? 1 : 0,
        count: n >= 2 ? n + ' 杯' : '',
        countStyle: 'font-size: 9px; color: #6f6259; height: 11px'
      };
    });
    const up = 'font-size: 12px; color: #3f5a4a';
    const down = 'font-size: 12px; color: #8a3f24';
    const row = (bean, method, n, dir, color, ratio) => ({
      bean, method, color, ratio,
      on: '★'.repeat(n), off: '★'.repeat(5 - n), starsLabel: '個人評分 ' + n + ' 顆星',
      arrow: dir > 0 ? '↑' : dir < 0 ? '↓' : '',
      arrowStyle: dir > 0 ? up : down,
      arrowLabel: dir > 0 ? '比上杯好' : dir < 0 ? '比上杯差' : '第一次沖'
    });
    const groups = [
      { title: '今天 · 10.26', rows: [
        row('哥倫比亞 粉紅波旁', '4:6 法 · V60', 4, 1, C.co, '1:15'),
        row('衣索比亞 古吉 花蝶', 'Hoffmann · V60', 5, 1, C.et, '1:16')
      ] },
      { title: '週五 · 10.24', rows: [
        row('肯亞 涅里 AA', '4:6 法 · V60', 3, -1, C.ke, '1:15'),
        row('哥倫比亞 粉紅波旁', '4:6 法 · V60', 3, 0, C.co, '1:15')
      ] }
    ];
    return { week, groups };
  }
}
</script>
</body>
</html>
