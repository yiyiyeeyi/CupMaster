<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<title>Live Brew 浮現文字</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;1,400&amp;family=Noto+Serif+TC:wght@400;500&amp;family=Noto+Sans+TC:wght@300;400;500&amp;family=Inter:wght@300;400;500&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#f6f2ea}a:hover{color:#ffffff}
</style>
</helmet>
<div style="width: 390px; height: 844px; position: relative; overflow: hidden; background: {{ground}}; color: #f6f2ea; font-family: Inter, 'Noto Sans TC', system-ui, sans-serif; font-variant-numeric: lining-nums tabular-nums; font-weight: 300; font-variant-numeric: lining-nums tabular-nums">

  <sc-if value="{{camera}}" hint-placeholder-val="{{true}}">
    <div style="position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; padding-bottom: 150px">
      <svg width="280" height="280" viewBox="0 0 280 280" aria-hidden="true">
        <sc-if value="{{guides}}" hint-placeholder-val="{{true}}">
          <ellipse cx="140" cy="140" rx="108" ry="95" fill="none" stroke="#f6f2ea" stroke-opacity=".45" stroke-width=".8" stroke-dasharray="3 6"></ellipse>
        </sc-if>
        <circle cx="184" cy="108" r="5.5" fill="none" stroke="#e8c7a2" stroke-width="1.2"></circle>
      </svg>
    </div>
    <span style="position: absolute; left: 0; right: 0; top: 330px; text-align: center; font-size: 10px; color: #8d7f72; letter-spacing: .16em">[ 俯拍鏡頭畫面 ]</span>
    <span style="position: absolute; left: 238px; top: 206px; font-size: 10px; letter-spacing: .12em; color: #e8c7a2">壺嘴</span>
    <div style="position: absolute; left: 0; right: 0; top: 0; height: 130px; background: linear-gradient(rgba(18,14,12,.5), rgba(18,14,12,0))"></div>
    <div style="position: absolute; left: 0; right: 0; bottom: 0; height: 470px; background: linear-gradient(rgba(18,14,12,0), rgba(18,14,12,.78) 50%)"></div>
  </sc-if>

  <div style="position: absolute; left: 14px; right: 14px; top: 14px; display: grid; grid-template-columns: 44px 1fr 44px; align-items: center">
    <button type="button" aria-label="結束沖煮" style="width: 44px; height: 44px; border: 0; background: transparent; color: #f6f2ea; display: grid; place-items: center; cursor: pointer; padding: 0">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"></path></svg>
    </button>
    <div style="display: flex; flex-direction: column; align-items: center; gap: 1px">
      <span style="font-family: 'Cormorant Garamond', 'Noto Serif TC', serif; font-size: 17px; font-weight: 500; letter-spacing: .04em">4:6 法</span>
      <span style="font-size: 10px; letter-spacing: .2em; color: #cbbdad">{{elapsed}} / 3:30</span>
    </div>
    <button type="button" aria-label="沖煮設定：鏡頭、引導線、語音" style="width: 44px; height: 44px; border: 0; background: transparent; color: #f6f2ea; display: grid; place-items: center; cursor: pointer; padding: 0">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4" aria-hidden="true"><path d="M4 7h10M18 7h2M4 17h2M10 17h10"></path><circle cx="16" cy="7" r="2"></circle><circle cx="8" cy="17" r="2"></circle></svg>
    </button>
  </div>

  <sc-if value="{{menu}}" hint-placeholder-val="{{false}}">
    <div style="position: absolute; right: 16px; top: 64px; width: 220px; background: rgba(246,242,234,.97); color: #211a16; border-radius: 14px; padding: 6px 16px; font-weight: 400; box-shadow: 0 10px 30px rgba(0,0,0,.25)">
      <label style="display: flex; justify-content: space-between; align-items: center; min-height: 46px; font-size: 14px; border-bottom: 1px solid #e3d9cc">鏡頭<input type="checkbox" checked="{{true}}" style="width: 18px; height: 18px; accent-color: #211a16"></label>
      <label style="display: flex; justify-content: space-between; align-items: center; min-height: 46px; font-size: 14px; border-bottom: 1px solid #e3d9cc">對位引導線<input type="checkbox" checked="{{true}}" style="width: 18px; height: 18px; accent-color: #211a16"></label>
      <label style="display: flex; justify-content: space-between; align-items: center; min-height: 46px; font-size: 14px">語音提示<input type="checkbox" checked="{{true}}" style="width: 18px; height: 18px; accent-color: #211a16"></label>
    </div>
  </sc-if>

  <div style="position: absolute; left: 30px; right: 30px; bottom: 206px; display: flex; flex-direction: column">
    <span style="font-size: 11px; letter-spacing: .24em; color: #e8c7a2">{{kicker}}</span>

    <sc-if value="{{tempChange}}" hint-placeholder-val="{{false}}">
      <div style="display: flex; align-items: center; gap: 8px; margin-top: 14px; padding: 8px 0; border-top: .5px solid rgba(232,199,162,.6); border-bottom: .5px solid rgba(232,199,162,.6)">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#e8c7a2" stroke-width="1.4" aria-hidden="true"><path d="M10 4a2 2 0 0 1 4 0v9a4 4 0 1 1-4 0z"></path></svg>
        <span style="font-size: 14px; font-weight: 400">這一段改用 <b style="font-weight: 500; color: #e8c7a2">85°C</b> 的水</span>
      </div>
    </sc-if>

    <sc-if value="{{hasNumber}}" hint-placeholder-val="{{true}}">
      <span style="font-family: 'Cormorant Garamond', Georgia, serif; font-weight: 400; font-size: 104px; line-height: .9; margin-top: 10px; letter-spacing: -.01em; font-variant-numeric: lining-nums">{{big}}<span style="font-size: 36px; margin-left: 4px">{{unit}}</span></span>
    </sc-if>
    <sc-if value="{{isDrain}}" hint-placeholder-val="{{false}}">
      <span style="font-family: 'Noto Serif TC', serif; font-weight: 400; font-size: 38px; line-height: 1.25; margin-top: 14px">等水位<br>降到粉床</span>
    </sc-if>

    <div style="display: flex; align-items: center; gap: 10px; margin-top: 14px">
      <sc-if value="{{showSpiral}}" hint-placeholder-val="{{true}}">
        <svg width="22" height="22" viewBox="0 0 34 34" aria-hidden="true"><path d="M17 17 m0 -2 a2 2 0 1 1 -2 2 a5 5 0 0 1 5 -5 a8 8 0 0 1 8 8 a11 11 0 0 1 -11 11 a13 13 0 0 1 -13 -13" fill="none" stroke="#f6f2ea" stroke-width="1.4" stroke-linecap="round"></path></svg>
      </sc-if>
      <sc-if value="{{showCenter}}" hint-placeholder-val="{{false}}">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#f6f2ea" stroke-width="1.4" aria-hidden="true"><path d="M12 3v11"></path><path d="M8.5 10.5L12 14l3.5-3.5"></path><circle cx="12" cy="19" r="2"></circle></svg>
      </sc-if>
      <sc-if value="{{showHourglass}}" hint-placeholder-val="{{false}}">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#f6f2ea" stroke-width="1.4" aria-hidden="true"><path d="M7 3h10M7 21h10M8 3c0 5 8 5 8 9s-8 4-8 9M16 3c0 5-8 5-8 9s8 4 8 9"></path></svg>
      </sc-if>
      <span style="font-family: 'Noto Serif TC', serif; font-size: 17px; font-weight: 400">{{cue}}</span>
    </div>
    <span style="font-size: 12px; color: #cbbdad; margin-top: 6px; padding-left: 32px">{{sub}}</span>
  </div>

  <div style="position: absolute; left: 30px; right: 30px; bottom: 156px; display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 4px">
    <sc-for list="{{stages}}" as="s" hint-placeholder-count="5">
      <span style="{{s.bar}}"></span>
    </sc-for>
  </div>
  <span style="position: absolute; left: 30px; bottom: 128px; font-size: 11px; letter-spacing: .08em; color: #a8998b">{{next}}</span>

  <div style="position: absolute; left: 0; right: 0; bottom: 34px; display: flex; justify-content: center; align-items: center; gap: 40px">
    <button type="button" aria-label="上一步" style="width: 48px; height: 48px; border-radius: 50%; border: .8px solid rgba(246,242,234,.35); background: transparent; color: #f6f2ea; display: grid; place-items: center; cursor: pointer">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><path d="M15 5l-7 7 7 7"></path></svg>
    </button>
    <sc-if value="{{isDrain}}" hint-placeholder-val="{{false}}">
      <button type="button" style="height: 56px; padding: 0 26px; border-radius: 999px; border: 0; background: #f6f2ea; color: #211a16; font-size: 15px; font-weight: 500; cursor: pointer">已濾乾，下一段</button>
    </sc-if>
    <sc-if value="{{notDrain}}" hint-placeholder-val="{{true}}">
      <button type="button" aria-label="暫停" style="width: 68px; height: 68px; border-radius: 50%; border: 0; background: #f6f2ea; color: #211a16; display: grid; place-items: center; cursor: pointer">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><rect x="6.5" y="5" width="3.5" height="14" rx="1"></rect><rect x="14" y="5" width="3.5" height="14" rx="1"></rect></svg>
      </button>
    </sc-if>
    <button type="button" aria-label="下一步" style="width: 48px; height: 48px; border-radius: 50%; border: .8px solid rgba(246,242,234,.35); background: transparent; color: #f6f2ea; display: grid; place-items: center; cursor: pointer">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><path d="M9 5l7 7-7 7"></path></svg>
    </button>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"mode":{"editor":"enum","options":["pour","wait","drain","temp"],"default":"pour"},"camera":{"editor":"boolean","default":true},"menu":{"editor":"boolean","default":false},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const mode = this.props.mode ?? 'pour';
    const camera = this.props.camera ?? true;
    const menu = this.props.menu ?? false;
    const M = {
      pour:  { cur: 1, kicker: '第 2 段 · 注水', big: '120', unit: 'g', cue: '從中心往外，緩慢繞圈', sub: '水柱細而穩，避開濾紙邊緣', icon: 'spiral', next: '接下來　等待濾乾', elapsed: '0:52' },
      wait:  { cur: 0, kicker: '悶蒸 · 等待', big: '0:21', unit: '', cue: '讓粉層慢慢吸飽水', sub: '粉層膨起、冒小泡是正常的', icon: 'hourglass', next: '接下來　注水至 120g', elapsed: '0:24' },
      drain: { cur: 2, kicker: '第 3 段前 · 等待', big: '', unit: '', cue: '已過 0:26', sub: '通常 20–40 秒，粗研磨會比較快', icon: 'hourglass', next: '接下來　注水至 180g', elapsed: '1:42' },
      temp:  { cur: 3, kicker: '第 4 段 · 注水', big: '240', unit: 'g', cue: '中心定點注水', sub: '壺嘴靠近粉層，水流垂直落下', icon: 'center', next: '接下來　等待 20 秒', elapsed: '2:15' }
    };
    const m = M[mode] || M.pour;
    const stages = [0, 1, 2, 3, 4].map((i) => ({
      bar: 'display: block; height: 2px; border-radius: 1px; background: ' + (i < m.cur ? '#f6f2ea' : i === m.cur ? '#e8c7a2' : 'rgba(246,242,234,.22)')
    }));
    return {
      camera, menu, guides: true,
      ground: camera ? '#3a302a' : '#211a16',
      kicker: m.kicker, big: m.big, unit: m.unit, cue: m.cue, sub: m.sub, next: m.next, elapsed: m.elapsed,
      hasNumber: mode !== 'drain', isDrain: mode === 'drain', notDrain: mode !== 'drain', tempChange: mode === 'temp',
      showSpiral: m.icon === 'spiral', showCenter: m.icon === 'center', showHourglass: m.icon === 'hourglass',
      stages
    };
  }
}
</script>
</body>
</html>
